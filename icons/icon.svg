<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#14213d"/>
  
  <defs>
    <path id="arc" d="M 248.25170000000003 775.7483 A 373.0 373.0 0 1 1 775.7483 775.7483"/>
  </defs>
  <circle cx="512" cy="512" r="395.0" fill="none" stroke="#c9a227" stroke-width="90"/>
  <circle cx="512" cy="512" r="440" fill="none" stroke="#14213d" stroke-width="6" stroke-opacity="0.5"/>
  <circle cx="512" cy="512" r="350" fill="none" stroke="#14213d" stroke-width="6" stroke-opacity="0.5"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="10" fill="#14213d">
    <textPath href="#arc" startOffset="46%" text-anchor="middle">CONJUNCTA VIRTUTI FORTUNA</textPath>
  </text>
  <g fill="#c9a227" stroke="#14213d" stroke-width="8">
    <rect x="452" y="842" width="120" height="130" rx="14"/>
    <rect x="482" y="870" width="60" height="74" rx="8" fill="none"/>
  </g>
  
  <g transform="translate(484 506) scale(0.74) translate(-512 -475)"
     stroke="#5d6878" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- upper arm (rerebrace), running off to the right, with plate joints -->
    <path d="M430 712 L905 726 L905 846 L436 842 Z" fill="#d9dee6"/>
    <path d="M600 718 L600 844 M720 721 L720 845 M830 724 L830 846" fill="none"/>
    <!-- forearm (vambrace), from elbow up to the wrist -->
    <path d="M466 552 L566 566 L512 806 L380 770 Z" fill="#d9dee6"/>
    <path d="M452 612 L556 628" fill="none"/>
    <!-- elbow guard (couter) -->
    <circle cx="420" cy="790" r="84" fill="#d9dee6"/>
    <path d="M420 706 L420 874 M336 790 L504 790" fill="none" stroke-width="8"/>
    <circle cx="420" cy="790" r="30" fill="#d9dee6"/>
    <!-- sword blade with a groove down the middle -->
    <path d="M536 92 L566 168 L564 444 L508 444 L506 168 Z" fill="#eef2f7"/>
    <line x1="536" y1="176" x2="536" y2="436" stroke-width="7"/>
    <!-- pommel at the bottom of the grip -->
    <circle cx="536" cy="612" r="28" fill="#d4a537"/>
    <!-- crossguard with rounded ends -->
    <path d="M416 438 L656 438 L656 474 L416 474 Z" fill="#d4a537"/>
    <circle cx="414" cy="456" r="24" fill="#d4a537"/>
    <circle cx="658" cy="456" r="24" fill="#d4a537"/>
    <!-- gauntleted fist round the grip: four fingers and a thumb -->
    <path d="M468 492 Q468 474 488 474 L598 474 Q616 474 616 494 L616 566 Q616 586 596 586 L488 586 Q468 586 468 566 Z" fill="#d9dee6"/>
    <path d="M468 502 L604 502 M468 530 L612 530 M468 558 L604 558" fill="none" stroke-width="8"/>
    <path d="M596 474 L596 586" fill="none" stroke-width="8"/>
    <path d="M454 480 Q454 466 470 466 L520 466 Q536 466 536 482 L536 494 Q536 508 520 508 L470 508 Q454 508 454 494 Z" fill="#d9dee6"/>
  </g>
</svg>
