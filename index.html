<!doctype html>
<!--
  index.html — the one and only page of the app.
  The browser reads this file first. It loads the styling (styles.css)
  and the code (js/app.js), then shows what's inside <body>.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit the iPhone screen instead of a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- These lines make "Add to Home Screen" open full-screen like a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CMac Sports">
  <link rel="manifest" href="manifest.json">

  <!-- App icon on the Home Screen, and the little icon in browser tabs -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">

  <!-- Color of the bar behind the clock/battery, matching light or dark mode -->
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <title>CMac Sports</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-bar">
    <!-- js/app.js changes this title to match the current tab -->
    <h1 id="title">CMac Sports</h1>
    <!-- "Updated 8:02 PM ↻" — tap it to refresh. Hidden on screens without scores. -->
    <button id="updated" class="updated" hidden><span></span> ↻</button>
  </header>

  <!-- The "Pull to refresh" arrow that appears when you drag the screen down -->
  <div id="pull" class="pull">
    <span class="pull-arrow">↓</span>
    <span class="pull-label">Pull to refresh</span>
  </div>

  <main id="screen">
    <!-- js/app.js puts the current screen's content in here -->
  </main>

  <!--
    The tab bar along the bottom. Each tab is a link to "#name".
    When you tap one, the address changes (e.g. to #scores) and
    js/app.js notices and shows that screen.
    The <svg> parts are the little icons, drawn with lines.
  -->
  <nav class="tab-bar">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#scores" data-tab="scores">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Scores</span>
    </a>
    <a href="#leagues" data-tab="leagues">
      <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>
      <span>Leagues</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- "type=module" lets our JavaScript files load each other -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
